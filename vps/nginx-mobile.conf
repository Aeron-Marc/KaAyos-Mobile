server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Mobile API Backend (Express Node.js on port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static uploads directory (avatars, documents, portfolios, receipts)
    location /uploads/ {
        alias /var/www/KaAyos-Mobile/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Optional: Serve Expo Web Build as a web app if exported
    location / {
        root /var/www/KaAyos-Mobile/dist;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}

